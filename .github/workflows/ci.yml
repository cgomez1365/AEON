name: AEON CI

# When it runs (audit #11, #42, 2026-10-03):
#
# - push: main and v* tags only. Every branch push used to run the full
#   matrix, so a release commit ran it three times (branch, main, tag) and a
#   Dependabot branch twice (push, then its pull request). Each extra run was
#   one more chance for a flaky leg to paint a red X on a good commit. Work on
#   a branch gets its signal from the pull request below, which also checks
#   the merge result: a different commit, and the one that lands.
# - pull_request to main.
# - schedule, weekly: an advisory published while nobody pushes still reaches
#   the security job, and a waiver's review date passing still shows up as red.
# - workflow_dispatch: Actions > AEON CI > Run workflow, on any branch.
#
# The trade-off: a branch pushed with no pull request gets no run at all. The
# v3.2.0 evidence (run 37102458513) came from a push to release-3.2.0; that
# run now needs a pull request to main or a manual dispatch.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Mondays 09:17 UTC. Off the hour: GitHub delays scheduled runs most at
    # the top of the hour.
    - cron: '17 9 * * 1'
  workflow_dispatch:

# Nothing here writes to the repo, opens an issue or reads a secret. Read-only
# no longer depends on the repo's default token setting (audit #43).
permissions:
  contents: read

# A newer push to the same pull request cancels the run it replaces. A push to
# main, a tag and the weekly run are keyed on the commit as well, so every
# commit on main and every release keeps its own result; nothing there is
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name != 'pull_request' && github.sha || 'latest' }}
  cancel-in-progress: true

jobs:
  build:
    # Without a limit, a hung test or install could hold a runner for GitHub's
    # default of six hours. The slowest green leg, Windows, took 3 min 13 s in run
    # 37102458513 (v3.2.0).
    timeout-minutes: 20
    # Windows is the platform AEON actually ships on, and Linux is what CI used
    # to run exclusively — a test that resolved paths with pathname.slice(1) was
    # green on every dev box and broken only in CI, which is the same gap in the
    # other direction. Run both.
    #
    # The 22.13 leg proves the floor declared in package.json engines and
    # launch.js is real: the previous gate allowed Node 18 while pdfjs-dist
    # needed >=22.13, and nothing ever built at the version we claimed to support.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every leg installs with `npm ci` (the step below): the
          # reproducible install, and the one that must gate a merge.
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'
          # The floor leg runs `npm ci`, as the README's update steps and the
          # v3.2.0 notes tell a git-clone user to, and as launch.js does when
          # the last install did not finish.
          #
          # Node 22.13 bundles npm 10, and macOS 11 to 13.4 users are sent to
          # Node 22 by the README. This leg used `npm install` because npm 10
          # refused the lockfile npm 11 wrote ("Missing: esbuild@0.28.2 ...",
          # 27 lines); `npm install` hid exactly the failure those users hit
          # (audit #6). The lockfile is now one both npm 10 and npm 11 accept.
          # This leg fails if it drifts back; write the lockfile with npm 10:
          #   npx -y npm@10.9.2 install --package-lock-only
          - os: ubuntu-latest
            node: '22.13'
          # Node 26 becomes LTS on 2026-10-28. LAUNCH.bat (winget) and launch.sh
          # (setup_lts.x) install it from then; Homebrew's plain node formula
          # already does. engines has no upper bound, so it gets a leg before
          # customers get it (audit #13).
          - os: ubuntu-latest
            node: '26'
          # macOS. launch.command ran once, by hand, on real Apple hardware on
          # 2026-08-12 — which is what closed DoD §20 #1 on clean physical
          # hardware. One manual run proves it worked that day; it cannot prove
          # it still works, and this is the launcher with a KNOWN first-run
          # friction defect (it needed a chmod), so it is the one most likely to
          # regress silently. Free: the repo is public.
          #
          # This leg is NOT a replacement for that run and must not be cited as
          # one (§08). It never installs a model and never pulls the network, so
          # it says nothing about "a local model answered offline". What it does
          # say: the suite, gates and build hold on macOS, and launch.command
          # still parses there.
          #
          # Note the chmod that run needed is NOT a missing git mode —
          # launch.command is committed 100755, and tests/launcher-contract
          # keeps it that way. A downloaded zip loses modes and Gatekeeper
          # quarantines downloaded files; neither is reproducible in CI, so that
          # friction stays an open defect rather than a solved one.
          - os: macos-latest
            node: '24'
    # Windows runners default to PowerShell; the node -e and grep steps below
    # are bash. GitHub's Windows images ship bash, so pin it for every step
    # rather than maintaining two dialects of the same check.
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to a commit: a tag can be moved to other code, a
      # commit cannot. Dependabot (github-actions, monthly) bumps the pin and
      # the version comment together. persist-credentials: false keeps the
      # job token out of .git/config, where every later step could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # launch.js runs `npm install` on a first launch. If this leg's npm would
      # rewrite package-lock.json, it rewrites it in a git-clone user's
      # checkout too, and their next `git pull` that touches it stops (audit
      # #6). Linux legs only: npm 10 on the floor leg, npm 11 on Node 24 and 26.
      # Fix a failure by writing the lockfile with npm 10 (see the floor leg).
      - name: Lockfile stays as committed under this npm
        if: runner.os == 'Linux'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code package-lock.json

      - name: Syntax-check server
        run: node --check server.cjs

      # Block scalar (|), not a plain multi-line scalar. `run: node -e "` reads
      # as a PLAIN scalar — the quote is mid-value, so YAML never treats it as
      # a delimiter — and a plain scalar cannot contain ": ". A single
      # `console.error('MISSING: ' + b)` made the whole workflow unparseable,
      # which GitHub reports as "No jobs were run" rather than a syntax error.
      - name: Verify block manifests
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = path.join("src", "blocks");
            const blocks = fs.readdirSync(dir).filter(f => fs.statSync(path.join(dir, f)).isDirectory());
            let ok = 0, missing = 0;
            for (const b of blocks) {
              const m = path.join(dir, b, "block.manifest.json");
              if (fs.existsSync(m)) { ok++; } else { missing++; console.error("MISSING: " + b); }
            }
            console.log(ok + " manifests OK, " + missing + " missing");
            if (missing > 0) process.exit(1);
          '

      # BO-J2 — snapshot before, compare after: the assertion is the DELTA
      # across the test run, so it holds whether or not the tree started clean.
      - name: Tree integrity — snapshot
        run: node tools/scan/tree-integrity.cjs --snapshot

      - name: Run tests
        run: npm test

      - name: Tree integrity — tests must not write to the checkout
        run: npm run scan:tree

      # Hard release gate: zero Ollama assumptions, no unauthorized machine-root
      # access. Ran only by hand until now, which is how a launch.js require() of
      # a deleted module reached main and broke boot on every fresh clone.
      - name: Release gate (no-ollama + path authority)
        run: npm run scan:release-gate

      - name: Build
        run: npm run build

      # The bundle is the only place a leaked secret actually reaches a user.
      # Manifests legitimately ship env var NAMES; a JWT-shaped value is a leak.
      - name: Assert no secret values in built bundle
        run: |
          if grep -roE "eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}" dist/ 2>/dev/null; then
            echo "::error::JWT-shaped secret found in dist/ — a key was bundled"
            exit 1
          fi
          echo "No secret values in dist/."

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      # --ignore-scripts: this job only reads the lockfile (npm audit) and greps
      # source, so no package's install script needs to run. ffmpeg-static's
      # downloads a binary from GitHub Releases, and a 504 there failed this job
      # on cd4e480 (run 34857985001) with nothing wrong in AEON.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # Was `npm audit --audit-level=high` with continue-on-error: true — a
      # check that cannot fail. The gate below fails on unreviewed high/critical
      # advisories in shipped code, and requires a written reason plus a review
      # date for each accepted one.
      - name: Dependency audit gate
        run: npm run scan:audit
      # Checks for a leaked KEY, not for the identifier. The old version grepped
      # all of src/ for the string "SUPABASE_SERVICE_ROLE_KEY", which matches
      # every block.manifest.json `env: [...]` declaration, every block README,
      # and every server-side src/blocks/*/api/ file. Those are var NAMES, not
      # values, and src/blocks/*/api/ never reaches the browser — so the check
      # could only ever fail. Scope it to code that is actually bundled.
      - name: Assert no service_role key reaches the client
        run: |
          if grep -rIl --include=*.jsx --include=*.tsx \
               -e "SUPABASE_SERVICE_ROLE_KEY" src/ 2>/dev/null; then
            echo "::error::service_role referenced in a client component — it would be bundled"
            exit 1
          fi
          echo "No service_role references in client components."
