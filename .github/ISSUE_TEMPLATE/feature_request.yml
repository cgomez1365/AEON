name: Feature request
description: Suggest something AEON should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does AEON get in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. If it fits as a block, say so — most new capability belongs in a block, not the kernel.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you use instead today
