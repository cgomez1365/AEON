<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEON Brain Visualizer</title>
    <style>
        html, body { width: 100%; height: 100%; }
        body { margin: 0; overflow: hidden; background: #0b0f19; font-family: 'Inter', 'Segoe UI', sans-serif; }
        #graph-container { width: 100%; height: 100%; }
        #hud {
            position: absolute; top: 20px; left: 20px;
            color: #00e5ff; text-transform: uppercase; letter-spacing: 2px;
            pointer-events: none; z-index: 10; text-shadow: 0 0 10px #00e5ff;
        }
        h1 { margin: 0; font-size: 24px; font-weight: 300; }
        p  { margin: 5px 0 0 0; font-size: 12px; color: #b0c4de; }
        #search-wrap { margin-top: 20px; position: relative; pointer-events: auto; }
        #search-input {
            padding: 10px 15px; width: 250px;
            background: rgba(0,0,0,0.6); border: 1px solid #00e5ff;
            color: #fff; font-family: 'Inter', sans-serif; outline: none;
            border-radius: 4px; box-shadow: 0 0 10px rgba(0,229,255,0.2);
        }
        #search-results {
            position: absolute; top: 100%; left: 0; width: 100%;
            background: rgba(0,0,0,0.85); border: 1px solid rgba(0,229,255,0.4);
            border-top: none; max-height: 300px; overflow-y: auto;
            display: none; border-radius: 0 0 4px 4px; z-index: 100;
        }
        .sr { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid rgba(0,229,255,0.2); font-size: 13px; color: #fff; }
        .sr:hover { background: rgba(0,229,255,0.2); }
        .sr-path { display: block; margin-top: 3px; font-size: 11px; color: #7fa8c4;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* the box always answers: a "no matches" / "can't fly there" row is not clickable */
        .sr-msg { cursor: default; color: #b0c4de; font-style: italic; }
        .sr-msg:hover { background: none; }
        .dg.ac { z-index: 20 !important; }
    </style>
    <!-- THREE must load before 3d-force-graph so the UMD build shares the instance -->
    <!-- Local-first, version-locked: one esbuild bundle of three@0.184 +
         3d-force-graph@1.80 from this repo's node_modules. The old CDN pair
         (three@0.155 pinned + 3d-force-graph@1 floating) drifted apart and
         died with "THREE.Timer is not a constructor" — blank graph. -->
    <script type="module">
        import { ForceGraph3D, THREE } from '/api/crn/second-brain/vendor/graph-bundle.mjs';
        window.THREE = THREE;
        window.ForceGraph3D = ForceGraph3D;
        document.dispatchEvent(new Event('graphlibs-ready'));
    </script>
</head>
<body>
    <div id="hud">
        <h1>AEON Matrix</h1>
        <p>SYSTEM VISUALIZER</p>
        <div id="search-wrap">
            <input type="text" id="search-input" placeholder="Search matrix nodes...">
            <div id="search-results"></div>
        </div>
    </div>
    <div id="graph-container"></div>

    <script>
    // ── Matrix Settings — persistent, self-contained ────────────────────────────
    // These controls used to live in a dat.GUI panel pulled from a CDN; when the
    // CDN was unreachable the whole settings panel silently vanished. They are
    // now native controls, persisted in localStorage, applied on every load.
    const MATRIX_SETTINGS_KEY = 'aeon_matrix_settings';
    // 2D map and Auto-organize (radial tree) options removed: numDimensions(2)
    // never visually flattened an already-positioned graph, and the radial DAG
    // just pinned everything around the vault center. 3D free physics only.
    const MATRIX_DEFAULTS = {
        nodeStyle: 'solid',     // 'solid' = defined orbs, 'fuzzy' = soft glow with no hard edge
        // Nodes get the same +30% the operator asked for and that links and
        // particles already received; raising only the slider's ceiling left the
        // default view byte-identical for anyone who never opens this panel.
        nodeBrightness: 1.3,
        focusMode: false,
        linkOpacity: 0.35,
        particles: false,
        // Particle opacity, straight through. The library gave particles no
        // control of their own and pinned them at linkOpacity*3 = 0.6; this
        // default is that 0.6 raised by the 30% the operator asked for.
        particleBrightness: 0.78,
        autoRotate: false,
        hideOrphans: false,
    };
    function loadMatrixSettings() {
        try { return { ...MATRIX_DEFAULTS, ...(JSON.parse(localStorage.getItem(MATRIX_SETTINGS_KEY)) || {}) }; }
        catch { return { ...MATRIX_DEFAULTS }; }
    }
    function saveMatrixSettings(s) {
        try { localStorage.setItem(MATRIX_SETTINGS_KEY, JSON.stringify(s)); } catch {}
    }

    // ── Sprite factory ──────────────────────────────────────────────────────────
    // Flat canvas-texture sprites replace 3-D sphere meshes.
    // A sphere at resolution 8 = ~240 vertices; a sprite = 4 vertices.
    // The canvas TEXTURE is cached by look and shared; the material is not.
    // Focus mode dims a node by writing its material.opacity, so a material
    // shared between nodes dimmed every node that shared it — including the one
    // under the cursor. See makeSprite.
    const spriteTexCache = new Map();
    function hexToRgba(hex, a) {
        const n = parseInt(hex.replace('#', ''), 16);
        return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
    }
    function brightenHex(hex, brightness = 1) {
        const n = parseInt(hex.replace('#', ''), 16);
        // Upper bound tracks the Node brightness slider's max (2.6) — at 2.5 the
        // top of the range was silently clipped and the last steps did nothing.
        const scale = Math.max(0.35, Math.min(2.6, Number(brightness) || 1));
        const r = Math.min(255, Math.round(((n >> 16) & 255) * scale));
        const g = Math.min(255, Math.round(((n >> 8) & 255) * scale));
        const b = Math.min(255, Math.round((n & 255) * scale));
        return `#${[r, g, b].map(v => v.toString(16).padStart(2, '0')).join('')}`;
    }
    function makeSprite(color, radius, style = 'solid', brightness = 1) {
        // Fuzzy nodes have no geometric edge — the falloff eats apparent size,
        // so scale them up and let additive blending give the nebula glow.
        const scale = style === 'fuzzy' ? radius * 1.9 : radius;
        // Ceiling is per style. Fuzzy sprites blend ADDITIVELY and are drawn at
        // radius*1.9, so they overlap constantly and saturate against each
        // other; pushing them to 2.6 turned the graph into a white wash and
        // flattened four of the seven type colours to #ffffff. The 1.8 -> 2.6
        // lift was aimed at the solid style, which blends normally — fuzzy
        // keeps the ceiling it already had.
        const ceiling = style === 'fuzzy' ? 1.8 : 2.6;
        const capped = Math.max(0.35, Math.min(ceiling, Number(brightness) || 1));
        const brightColor = brightenHex(color, capped);
        const alphaBoost = Math.max(0.45, capped);
        const key = style + ':' + brightColor + ':' + radius + ':' + alphaBoost.toFixed(2);
        const cached = spriteTexCache.get(key);
        if (cached) return wrapSprite(cached, style, scale);
        const sz = 64;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = sz;
        const ctx = canvas.getContext('2d');
        if (style === 'fuzzy') {
            // Continuous gaussian-like falloff from center to transparent —
            // no filled disc, no arc, no defined boundary at any radius.
            const grd = ctx.createRadialGradient(sz/2, sz/2, 0, sz/2, sz/2, sz/2);
            grd.addColorStop(0,    hexToRgba(brightColor, Math.min(1, 0.95 * alphaBoost)));
            grd.addColorStop(0.18, hexToRgba(brightColor, Math.min(1, 0.55 * alphaBoost)));
            grd.addColorStop(0.45, hexToRgba(brightColor, Math.min(1, 0.18 * alphaBoost)));
            grd.addColorStop(0.75, hexToRgba(brightColor, Math.min(1, 0.05 * alphaBoost)));
            grd.addColorStop(1,    hexToRgba(brightColor, 0));
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, sz, sz);
        } else {
            // Solid orb: defined disc with a soft halo rim
            const grd = ctx.createRadialGradient(sz/2, sz/2, sz*0.15, sz/2, sz/2, sz*0.48);
            grd.addColorStop(0,   brightColor);
            grd.addColorStop(0.6, brightColor);
            grd.addColorStop(1,   'rgba(0,0,0,0)');
            ctx.beginPath();
            ctx.arc(sz/2, sz/2, sz*0.48, 0, 2*Math.PI);
            ctx.fillStyle = grd;
            ctx.fill();
            // Above 1.0 the hex scale saturates — a cyan orb is already 255 on
            // G and B, so the top of the brightness range changed nothing for
            // the default 'solid' style. Spend the un-expressible part of the
            // boost on a real additive halo instead. At brightness <= 1 nothing
            // is drawn here; from the 1.3 default up, this rim is what actually
            // carries the extra brightness, and it does so without dragging the
            // node's hue toward white the way scaling RGB does.
            if (alphaBoost > 1) {
                // 0.5 / 1.6 — the halo reaches its cap at the slider maximum
                // (2.6), not at 2.0. At *0.5 it saturated a third of the way
                // from the top, and because brightenHex has already saturated
                // the cyan by 1.054 the whole 2.0-2.6 span rendered pixels
                // identical to 2.0: the exact clipping this change set out to fix.
                const halo = Math.min(0.5, (alphaBoost - 1) * 0.3125);
                const g2 = ctx.createRadialGradient(sz/2, sz/2, sz*0.30, sz/2, sz/2, sz/2);
                g2.addColorStop(0, hexToRgba(brightColor, halo));
                g2.addColorStop(1, hexToRgba(brightColor, 0));
                ctx.globalCompositeOperation = 'lighter';
                ctx.fillStyle = g2;
                ctx.fillRect(0, 0, sz, sz);
                ctx.globalCompositeOperation = 'source-over';
            }
        }
        const tex = new THREE.CanvasTexture(canvas);
        spriteTexCache.set(key, tex);
        return wrapSprite(tex, style, scale);
    }
    // One SpriteMaterial PER NODE, sharing the cached texture. Chosen over
    // cloning the material for the focused node on hover: a SpriteMaterial is a
    // small plain object while the canvas + CanvasTexture is the expensive part
    // and is still shared, so this costs nothing per frame, whereas cloning
    // would allocate during interaction for the whole highlighted set (a hub
    // node highlights all its neighbours) and have to be undone on un-hover.
    function wrapSprite(tex, style, scale) {
        const s = new THREE.Sprite(new THREE.SpriteMaterial({
            map: tex, transparent: true, depthWrite: false,
            blending: style === 'fuzzy' ? THREE.AdditiveBlending : THREE.NormalBlending,
        }));
        s.scale.set(scale, scale, 1);
        return s;
    }

    // ── Color helpers ───────────────────────────────────────────────────────────
    // Aurora palette — mirrors src/aurora.css (--accent cyan, --accent2 violet)
    const TYPE_COLORS = {
        dir: '#00f2ff', md: '#7fe8f2', txt: '#dce8f5', json: '#b18cff',
        pdf: '#ff6b9d', html: '#7c3aed', default: '#4a6a8a',
    };
    function nodeColor(node) {
        if (node.root) return '#7c3aed';         // AEON VAULT center
        const isDir = node.type === 'folder' || node.type === 'dir';
        if (isDir) return '#00f2ff';
        return TYPE_COLORS[node.ext] || node.color || TYPE_COLORS.default;
    }

    // ── Data fetch ──────────────────────────────────────────────────────────────
    const _fetchGraph = async () => {
        try {
            const r = await fetch('/api/crn/second-brain/graph');
            if (r.ok) return r.json();
        } catch {}
        return { nodes: [], links: [] };
    };

    // Wait for both the graph data AND the module bundle (module scripts are
    // deferred, so ForceGraph3D may not exist when this classic script parses).
    const _libsReady = new Promise(resolve => {
        if (window.ForceGraph3D) resolve();
        else document.addEventListener('graphlibs-ready', resolve, { once: true });
    });
    Promise.all([_fetchGraph(), _libsReady]).then(([data]) => {

        // ── Pre-index neighbors and links ─────────────────────────────────────
        const nodeMap = new Map();
        data.nodes.forEach(n => { n.neighbors = []; nodeMap.set(n.id, n); });
        const vaultRoot = data.nodes.find(n => n.root || n.id === 'vault_root' || n.name === 'AEON VAULT');
        if (vaultRoot) {
            vaultRoot.root = true;
            vaultRoot.fx = 0;
            vaultRoot.fy = 0;
            vaultRoot.fz = 0;
            vaultRoot.x = 0;
            vaultRoot.y = 0;
            vaultRoot.z = 0;
        }
        const linksByNode = new Map();
        data.links.forEach(link => {
            const a = link.source.id || link.source;
            const b = link.target.id || link.target;
            const na = nodeMap.get(a), nb = nodeMap.get(b);
            if (na) na.neighbors.push(b);
            if (nb) nb.neighbors.push(a);
            if (!linksByNode.has(a)) linksByNode.set(a, []);
            if (!linksByNode.has(b)) linksByNode.set(b, []);
            linksByNode.get(a).push(link);
            linksByNode.get(b).push(link);
        });

        // Which nodes survive "Hide orphans". Computed once — data.links never
        // changes — and guarded for ids-vs-objects because d3 hydrates endpoints
        // in place after the first tick.
        const linkedIds = new Set();
        data.links.forEach(l => { linkedIds.add(l.source.id || l.source); linkedIds.add(l.target.id || l.target); });
        const isShown = (n) => !settings.hideOrphans || linkedIds.has(n.id) || n.root;

        const settings = loadMatrixSettings();

        let highlightNodes = new Set();
        let highlightLinks = new Set();
        let focusMode  = settings.focusMode;
        let physicsOn  = true;   // turns false after engine stops
        let spriteMode = true;   // try sprites; falls back to spheres

        // ── Graph init ────────────────────────────────────────────────────────
        const elem = document.getElementById('graph-container');
        let Graph;
        try {
            // rendererConfig: disable antialias + request discrete GPU
            Graph = ForceGraph3D({
                rendererConfig: { antialias: false, powerPreference: 'high-performance' }
            })(elem);
        } catch {
            Graph = ForceGraph3D()(elem);
        }

        // Cap pixel ratio — retina screens render 4× the pixels at ratio 2.
        // 1.25 is the sweet spot for a graph view: 60% fewer pixels than retina,
        // and node orbs/lines don't visibly degrade like text would.
        try { Graph.renderer().setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25)); } catch {}
        const sizeGraph = () => {
            const w = Math.max(320, elem.clientWidth || window.innerWidth);
            const h = Math.max(320, elem.clientHeight || window.innerHeight);
            try { Graph.width(w).height(h); } catch {}
        };
        sizeGraph();
        if ('ResizeObserver' in window) new ResizeObserver(sizeGraph).observe(elem);
        window.addEventListener('resize', sizeGraph);

        // Stop rendering entirely when the tab or parent iframe is hidden —
        // the matrix should never burn GPU in the background.
        document.addEventListener('visibilitychange', () => {
            try {
                if (document.hidden) Graph.pauseAnimation();
                else Graph.resumeAnimation();
            } catch {}
        });

        // ── Node object: sprite (fast) or fallback sphere ─────────────────────
        const DIR_RADIUS  = 14;
        const FILE_RADIUS = 8;
        const PARTICLE_COLOR = '#00f2ff';  // matches the resting link colour
        const PARTICLE_WIDTH = 2;          // unchanged; brightness is the new knob
        Graph
            .nodeThreeObject(node => {
                if (!spriteMode) return null; // fallback: let library draw spheres
                try {
                    const r = (node.type === 'dir' || node.type === 'folder') ? DIR_RADIUS : FILE_RADIUS;
                    return makeSprite(nodeColor(node), r, settings.nodeStyle, settings.nodeBrightness);
                } catch { spriteMode = false; return null; }
            })
            .nodeThreeObjectExtend(false) // sprite IS the object, don't add sphere underneath

        // ── Link styling ──────────────────────────────────────────────────────
        // linkWidth MUST stay 0: any non-zero width makes the library render
        // each link as a cylinder MESH instead of a 1px GPU line — that is the
        // main cause of rotation lag on large graphs.
            .linkColor(() => `rgba(0,242,255,0.35)`)
            .linkWidth(0)
        // The library multiplies its OWN linkOpacity prop into whatever alpha
        // linkColor returns, and that prop defaults to 0.2 — so "Link opacity
        // 0.35" was reaching the screen as 0.35 * 0.2 = 0.07. Pinning the prop
        // to ~1 makes the alpha in linkColor, i.e. the slider, the real opacity.
        // The default stays 0.35; the number now means what it says.
        // Strictly under 1, though: the bundle builds the link material as
        // `{transparent: pe<1, opacity: pe, depthWrite: pe>=1}` with
        // `pe = linkOpacity * alphaOf(linkColor)`. At slider 1.0 that hit
        // exactly 1, flipping links to opaque depth-writing geometry that
        // occluded the transparent sprites and particles behind them.
            .linkOpacity(0.99)
            .linkDirectionalParticles(0)          // resting count comes from the
                                                  // operator's setting, via applySettings
            .linkDirectionalParticleWidth(PARTICLE_WIDTH)
            .linkDirectionalParticleSpeed(0.012)

        // ── Graph data ────────────────────────────────────────────────────────
            .graphData(data)
            .nodeLabel('name')
            .backgroundColor('#07080d')          // aurora --bg
            .showNavInfo(false)

        // ── Physics: settle fast ──────────────────────────────────────────────
            .d3AlphaDecay(0.06)       // settle fast — radial DAG needs few ticks
            .d3VelocityDecay(0.5)
            .warmupTicks(60)          // precompute layout before first paint:
                                      // rendering WHILE the 1.5k-node DAG
                                      // relaxes pegs the main thread
            .cooldownTicks(60)
            .cooldownTime(4000)
            .onEngineStop(() => { physicsOn = false; });

        // ── Particle appearance ───────────────────────────────────────────────
        // The library hands particles a material of its own making with
        // opacity = linkOpacity * 3 and offers no knob for it, so particles were
        // stuck at 0.6 forever. Supplying linkDirectionalParticleThreeObject
        // makes the library take OUR geometry and material instead, so the
        // Particle brightness slider is the particle opacity, full stop.
        // The geometry is built once and shared; only the material is rebuilt.
        let particleGeom = null, particleProto = null;
        function applyParticleStyle() {
            const opacity = Math.max(0.05, Math.min(1,
                Number(settings.particleBrightness) || MATRIX_DEFAULTS.particleBrightness));
            try {
                if (!particleGeom) particleGeom = new THREE.SphereGeometry(PARTICLE_WIDTH / 2, 4, 4);
                particleProto = new THREE.Mesh(particleGeom, new THREE.MeshLambertMaterial({
                    color: new THREE.Color(PARTICLE_COLOR), transparent: true, opacity,
                }));
                const proto = particleProto;
                // A FRESH closure every time: re-assigning the same function is a
                // no-op in 3d-force-graph, same trap as nodeThreeObject.
                Graph.linkDirectionalParticleThreeObject(() => proto);
            } catch (err) {
                // Silent failure here leaves the library's own particle path in
                // charge, whose opacity is linkOpacity*3 with no way to tune it
                // independently — so the slider goes inert AND particles get
                // brighter, with nothing on screen or in the console to say so.
                console.warn('[matrix] particle style failed; falling back to the library default', err);
            }
        }

        // ── Hover: coalesced to 1 update per animation frame ──────────────────
        // Without throttling, onNodeHover fires on every mousemove pixel. This
        // keeps the LATEST event rather than dropping it: the old version bailed
        // out while a frame was queued, so a fast pointer-out was thrown away and
        // the graph stayed stuck in its hovered state.
        let hoverRAF = null;
        let pendingHover = null;                    // newest event, applied next frame
        let currentHover = { node: null, link: null };  // what is on screen now

        // The operator's own setting is the resting state. Hover READS it and
        // never writes it — the old code restored with a hardcoded
        // linkDirectionalParticles(0), which is why particles had to be
        // re-enabled by hand after every hover.
        const baseParticles = () => (settings.particles ? 2 : 0);

        function setHighlight(node, link) {
            highlightNodes.clear();
            highlightLinks.clear();
            if (node) {
                highlightNodes.add(node.id);
                if (node.neighbors) node.neighbors.forEach(id => highlightNodes.add(id));
                (linksByNode.get(node.id) || []).forEach(l => highlightLinks.add(l));
            } else if (link) {
                // d3 hydrates link endpoints into node objects lazily; before it
                // does they are still bare ids. Guarded the same way applySettings
                // guards the identical access.
                highlightLinks.add(link);
                highlightNodes.add(link.source.id || link.source);
                highlightNodes.add(link.target.id || link.target);
            }
        }

        function applyHover(node, link) {
            currentHover = { node: node || null, link: link || null };
            setHighlight(node, link);
            const hovering = highlightNodes.size > 0 || highlightLinks.size > 0;
            // Focus mode is the only mode that reacts to hover. With it off the
            // graph stays exactly as the operator configured it — hovering used
            // to hijack the global particle state either way.
            if (!focusMode) return;
            const base = baseParticles();
            // Width stays 0 — emphasis is colour and particles, not thickness,
            // so links remain cheap GPU lines.
            Graph.linkColor(l =>
                !hovering             ? `rgba(0,229,255,${settings.linkOpacity})` :
                highlightLinks.has(l) ? '#00e5ff'
                                      : `rgba(0,229,255,${(settings.linkOpacity * 0.12).toFixed(3)})`
            );
            // Focused links get more particles; every other link keeps the
            // operator's count. Never zeroed.
            Graph.linkDirectionalParticles(
                hovering ? (l => (highlightLinks.has(l) ? 3 : base)) : base
            );
            // Dim sprite opacity via material — no geometry rebuild needed. Each
            // sprite owns its material (see makeSprite), so the focused node
            // really stays lit instead of being dimmed by a shared material.
            if (spriteMode) {
                data.nodes.forEach(n => {
                    if (n.__threeObj && n.__threeObj.material) {
                        n.__threeObj.material.opacity = !hovering ? 1
                            : highlightNodes.has(n.id) ? 1 : 0.06;
                        n.__threeObj.material.needsUpdate = true;
                    }
                });
            }
        }

        function queueHover(node, link) {
            pendingHover = { node, link };
            if (hoverRAF) return;                   // a frame is queued; it will
            hoverRAF = requestAnimationFrame(() => { //  pick up whatever is newest
                hoverRAF = null;
                const ev = pendingHover; pendingHover = null;
                if (ev) applyHover(ev.node, ev.link);
            });
        }

        Graph.onNodeHover(node => queueHover(node, null));
        // Link hover used to fill the highlight sets and then call applyHover(null),
        // whose first two statements cleared them again — the whole branch was
        // dead. Kept and made real: it now runs the same path as node hover, so
        // hovering a link highlights that link and its two endpoints.
        Graph.onLinkHover(link => queueHover(null, link));

        Graph.onNodeClick(node => {
            window.parent.postMessage(
                { type: 'NODE_CLICK', nodeId: node.id, nodeType: node.type, nodeName: node.name || node.title },
                '*'
            );
        });

        // ── Force tuning ──────────────────────────────────────────────────────
        // charge/link tweak EXISTING forces — no d3 global needed. The custom
        // center/radial constructors DO need d3, which the vendored bundle does
        // not expose: the bare `d3.forceCenter()` call threw a ReferenceError
        // here that silently killed everything below it (search, auto-rotate,
        // and the whole settings panel — the REAL "matrix settings lost" bug).
        // The library ships its own center force by default; the radial pull
        // was cosmetic. Guarded, never fatal.
        Graph.d3Force('charge').strength(-260);
        Graph.d3Force('link').distance(link => {
            const source = typeof link.source === 'object' ? link.source : nodeMap.get(link.source);
            const target = typeof link.target === 'object' ? link.target : nodeMap.get(link.target);
            return source?.root || target?.root ? 230 : 175;
        });
        Graph.d3Force('center', null);
        if (typeof d3 !== 'undefined') {
            try {
                Graph.d3Force('radial', d3.forceRadial(node => node.root ? 0 : 260).strength(node => node.root ? 1 : 0.025));
            } catch {}
        }
        Graph.cameraPosition({ x: 0, y: 0, z: 760 }, { x: 0, y: 0, z: 0 }, 0);

        // ── Search ────────────────────────────────────────────────────────────
        const searchInput   = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        searchInput.addEventListener('pointerdown', e => e.stopPropagation());
        searchResults.addEventListener('pointerdown', e => e.stopPropagation());
        // The camera flight is motion. Honour the OS setting: jump instead.
        const reduceMotion = window.matchMedia
            ? window.matchMedia('(prefers-reduced-motion: reduce)')
            : { matches: false };

        function clearResults() { searchResults.textContent = ''; searchResults.style.display = 'none'; }
        // One row, not clickable, saying what happened. An empty result and a
        // broken search box used to look identical — both just hid the dropdown.
        function searchMessage(text) {
            searchResults.textContent = '';
            const row = document.createElement('div');
            row.className = 'sr sr-msg';
            row.textContent = text;
            searchResults.appendChild(row);
            searchResults.style.display = 'block';
        }
        // true only if the camera actually went somewhere.
        function flyToNode(n) {
            if (!n || n.x == null || n.y == null || n.z == null) return false;
            const dist = 100;
            const ratio = 1 + dist / (Math.hypot(n.x, n.y, n.z) || 1);
            Graph.cameraPosition(
                { x: n.x*ratio, y: n.y*ratio, z: n.z*ratio }, n, reduceMotion.matches ? 0 : 1200
            );
            return true;
        }

        searchInput.addEventListener('input', e => {
            const q = e.target.value.toLowerCase().trim();
            if (!q) { clearResults(); return; }
            // Match the bare name, the vault-relative path and the id, so a path
            // fragment or a full id finds the node instead of only a filename.
            // Node objects carry no title today — nothing is invented here.
            const hits = data.nodes.filter(n =>
                [n.name, n.path, n.id].some(v => typeof v === 'string' && v.toLowerCase().includes(q))
            ).slice(0, 10);
            if (!hits.length) { searchMessage('No matches'); return; }
            searchResults.textContent = '';
            hits.forEach(n => {
                const label = n.name || n.id || '(unnamed)';
                // Built with DOM methods: node names come from the vault and are
                // not HTML. innerHTML on them was an injection waiting for a file
                // called <img onerror=...>.
                const row = document.createElement('div');
                row.className = 'sr';
                row.textContent = label;
                if (n.id && n.id !== label) {
                    const sub = document.createElement('span');
                    sub.className = 'sr-path';
                    sub.textContent = n.id;
                    row.appendChild(sub);
                }
                row.onclick = () => {
                    // Silence was the old answer to both of these.
                    if (!isShown(n)) {
                        searchMessage(label + ' — hidden by "Hide orphans". Turn it off to fly there.');
                        return;
                    }
                    if (!flyToNode(n)) {
                        searchMessage(label + ' — found, but the layout has not placed it yet. Try again in a moment.');
                        return;
                    }
                    searchInput.value = '';
                    clearResults();
                };
                searchResults.appendChild(row);
            });
            searchResults.style.display = 'block';
        });

        // ── Auto-rotate (RAF-free when off) ───────────────────────────────────
        let autoRotate = false, angle = 0, rotateRAF = null, isInteracting = false, interactTO = null;
        // Adaptive resolution: render at low res while the user is dragging or
        // zooming, snap back to full res when they stop. Motion hides the blur.
        const IDLE_DPR   = Math.min(window.devicePixelRatio || 1, 1.25);
        const MOTION_DPR = 0.75;
        const setInteracting = () => {
            if (!isInteracting) { try { Graph.renderer().setPixelRatio(MOTION_DPR); } catch {} }
            isInteracting = true; clearTimeout(interactTO);
            interactTO = setTimeout(() => {
                isInteracting = false;
                try { Graph.renderer().setPixelRatio(IDLE_DPR); } catch {}
            }, 400);
        };
        elem.addEventListener('mousedown', setInteracting);
        elem.addEventListener('wheel',     setInteracting, { passive: true });
        elem.addEventListener('touchstart',setInteracting, { passive: true });
        elem.addEventListener('touchmove', setInteracting, { passive: true });
        // keep low-res mode alive for the whole drag, not just the first click
        elem.addEventListener('mousemove', e => { if (e.buttons) setInteracting(); });
        function startRotation() {
            if (!autoRotate) { rotateRAF = null; return; }
            if (!isInteracting) {
                const { x, z } = Graph.cameraPosition();
                const d = Math.sqrt(x*x + z*z) || 800;
                angle += 0.001;
                Graph.cameraPosition({ x: d*Math.sin(angle), z: d*Math.cos(angle) });
            }
            rotateRAF = requestAnimationFrame(startRotation);
        }

        // ── Matrix Settings panel — native, no CDN, keyboard accessible ───────
        function applySettings(s, { relayout = false } = {}) {
            focusMode = s.focusMode;
            // Resting state — what the graph looks like with nothing hovered.
            Graph.linkColor(() => `rgba(0,229,255,${s.linkOpacity})`).linkWidth(0);
            Graph.linkDirectionalParticles(s.particles ? 2 : 0);
            applyParticleStyle();
            if (!s.focusMode) {
                data.nodes.forEach(n => {
                    if (n.__threeObj?.material) { n.__threeObj.material.opacity = 1; n.__threeObj.material.needsUpdate = true; }
                });
            } else {
                // Re-assert the focus overlay with the new numbers, keeping
                // whatever is hovered right now.
                applyHover(currentHover.node, currentHover.link);
            }
            Graph.graphData({
                nodes: s.hideOrphans ? data.nodes.filter(n => isShown(n)) : data.nodes,
                links: data.links,
            });
            autoRotate = s.autoRotate;
            if (autoRotate && !rotateRAF) startRotation();
            if (relayout) Graph.d3ReheatSimulation();
        }

        const panel = document.createElement('div');
        panel.innerHTML = `
        <style>
          #matrix-settings { position:absolute; top:20px; right:20px; z-index:30; font-family:'Inter','Segoe UI',sans-serif; }
          #ms-toggle { background:rgba(0,0,0,0.7); color:#00e5ff; border:1px solid #00e5ff; border-radius:6px;
                       padding:8px 14px; cursor:pointer; font-size:13px; letter-spacing:1px; }
          #ms-toggle:focus-visible, #ms-body :focus-visible { outline:2px solid #FFD700; outline-offset:2px; }
          #ms-body { display:none; margin-top:8px; background:rgba(0,0,0,0.85); border:1px solid rgba(0,229,255,0.4);
                     border-radius:8px; padding:14px 16px; width:240px; color:#dce8f5; font-size:13px; }
          #ms-body.open { display:block; }
          #ms-body label { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:10px 0; }
          #ms-body fieldset { border:1px solid rgba(0,229,255,0.25); border-radius:6px; margin:0 0 10px; padding:6px 10px 10px; }
          #ms-body legend { font-size:11px; color:#00e5ff; letter-spacing:1px; text-transform:uppercase; padding:0 4px; }
          #ms-body select, #ms-body input[type=range] { accent-color:#00e5ff; background:#0b0f19; color:#fff;
                     border:1px solid #244; border-radius:4px; }
          #ms-body button.ms-act { width:100%; margin-top:4px; background:none; border:1px solid #00e5ff; color:#00e5ff;
                     border-radius:5px; padding:6px; cursor:pointer; font-size:12px; }
        </style>
        <div id="matrix-settings">
          <button id="ms-toggle" aria-expanded="false" aria-controls="ms-body">⚙ MATRIX SETTINGS</button>
          <div id="ms-body" role="region" aria-label="Matrix settings">
            <fieldset>
              <legend>View</legend>
              <label>Node style
                <select id="ms-nodestyle" aria-label="Node style">
                  <option value="solid">Solid orbs</option>
                  <option value="fuzzy">Fuzzy glow</option>
                </select>
              </label>
              <label>Node brightness <input type="range" id="ms-brightness" min="0.5" max="2.6" step="0.05" aria-label="Node brightness"></label>
              <label>Auto rotate <input type="checkbox" id="ms-rotate"></label>
            </fieldset>
            <fieldset>
              <legend>Detail</legend>
              <label>Link opacity <input type="range" id="ms-opacity" min="0" max="1" step="0.05" aria-label="Link opacity"></label>
              <label>Particles <input type="checkbox" id="ms-particles"></label>
              <label>Particle brightness <input type="range" id="ms-pbright" min="0.2" max="1" step="0.05" aria-label="Particle brightness"></label>
              <label>Focus mode <input type="checkbox" id="ms-focus"></label>
              <label>Hide orphans <input type="checkbox" id="ms-orphans"></label>
            </fieldset>
            <button class="ms-act" id="ms-reheat">↻ Reheat physics</button>
            <button class="ms-act" id="ms-reset">Reset to defaults</button>
          </div>
        </div>`;
        document.body.appendChild(panel);
        const $ = (id) => document.getElementById(id);
        // Stop panel clicks from reaching the 3D canvas orbit controls
        $('matrix-settings').addEventListener('pointerdown', e => e.stopPropagation());

        // Swapping node style rebuilds every sprite: clear the material cache
        // and hand the library a FRESH accessor (same-function re-assign is a
        // no-op in 3d-force-graph; a new closure forces object regeneration).
        function rebuildSprites() {
            spriteTexCache.clear();
            Graph.nodeThreeObject(node => {
                if (!spriteMode) return null;
                try {
                    const r = (node.type === 'dir' || node.type === 'folder') ? DIR_RADIUS : FILE_RADIUS;
                    return makeSprite(nodeColor(node), r, settings.nodeStyle, settings.nodeBrightness);
                } catch { spriteMode = false; return null; }
            });
        }

        function syncPanel(s) {
            $('ms-nodestyle').value = s.nodeStyle || 'solid';
            $('ms-brightness').value = s.nodeBrightness ?? MATRIX_DEFAULTS.nodeBrightness;
            $('ms-rotate').checked = s.autoRotate;
            $('ms-opacity').value = s.linkOpacity;
            $('ms-particles').checked = s.particles;
            $('ms-pbright').value = s.particleBrightness ?? MATRIX_DEFAULTS.particleBrightness;
            $('ms-focus').checked = s.focusMode;
            $('ms-orphans').checked = s.hideOrphans;
        }
        syncPanel(settings);

        $('ms-toggle').onclick = () => {
            const body = $('ms-body');
            const open = !body.classList.contains('open');
            body.classList.toggle('open', open);
            $('ms-toggle').setAttribute('aria-expanded', String(open));
        };
        const update = (patch, opts) => {
            Object.assign(settings, patch);
            saveMatrixSettings(settings);
            applySettings(settings, opts);
        };
        $('ms-nodestyle').onchange= e => { update({ nodeStyle: e.target.value }); rebuildSprites(); };
        $('ms-brightness').oninput= e => { update({ nodeBrightness: Number(e.target.value) }); rebuildSprites(); };
        $('ms-rotate').onchange   = e => update({ autoRotate: e.target.checked });
        $('ms-opacity').oninput   = e => update({ linkOpacity: Number(e.target.value) });
        $('ms-particles').onchange= e => update({ particles: e.target.checked });
        $('ms-pbright').oninput   = e => update({ particleBrightness: Number(e.target.value) });
        $('ms-focus').onchange    = e => update({ focusMode: e.target.checked });
        $('ms-orphans').onchange  = e => update({ hideOrphans: e.target.checked });
        $('ms-reheat').onclick    = () => Graph.d3ReheatSimulation();
        // rebuildSprites() is not optional: nodeStyle and nodeBrightness only
        // reach the screen through nodeThreeObject, which applySettings never
        // touches and which the library reuses verbatim because graphData keys
        // nodes by object identity. Without it, reset leaves the panel and
        // localStorage saying solid/1.3 while the graph still renders the old
        // sprites. Both per-control handlers above already call it.
        $('ms-reset').onclick     = () => { Object.assign(settings, MATRIX_DEFAULTS); saveMatrixSettings(settings); syncPanel(settings); applySettings(settings, { relayout: true }); rebuildSprites(); };

        // Apply persisted settings on load
        applySettings(settings);

    });
    </script>
</body>
</html>
