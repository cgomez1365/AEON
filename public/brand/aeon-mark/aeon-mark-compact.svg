<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="aeon-compact-title">
  <title id="aeon-compact-title">AEON</title>
  <!--
    THE AEON MARK, SMALL-SIZE CUT - the tab icon at every scale, and any <img>
    drawn at 24 CSS px or less.

    Not a different logo: the full mark's chevron outline inside its ring
    element, with the outer segmented ring and its node circles removed and the
    glow dropped - and the ring and band re-cut to a 16px budget, stated below.

    At 16px the whole icon is sixteen pixels across. The outer ring, its four
    gaps and three node circles together occupy a band about one pixel wide, so
    they cannot draw as themselves - they average into a grey halo that costs
    contrast everywhere and, worse, shrinks the chevron to a smudge to make
    room. Spending all sixteen pixels on the chevron and one ring is the only
    way the mark survives. Size-specific cuts are ordinary in icon sets for
    exactly this reason; this file is that cut.

    Where it is used: the 16px and 22px <img>s in DesktopLayout load THIS FILE
    directly, so every device-pixel ratio rasterises the compact cut at its own
    size. index.html links it as the SVG favicon because Firefox takes an SVG
    favicon regardless of link order. tools/generate-aeon-brand-icons.mjs
    rasterises it for every PNG of 48px or less, which is what favicon.ico's
    16/32/48 frames are: a 16 CSS px tab at 1x, 2x and 3x. Chrome and Safari
    show the 32 frame on a 2x display, so that frame must be this cut too, or
    the tab shows one mark and the sidebar beside it another. The same three
    PNGs are the 16/32/48 "any" icons in both web manifests, which is where an
    installed PWA takes its taskbar and title-bar icons from. One accepted
    consequence: AEON.ico shares those frames, so a Windows 48px shortcut at 1x
    shows this cut while the boot gate at 48 CSS px shows the full mark.

    Geometry: aeon-mark.svg's chevron scaled about the centre by 186/118 =
    1.576. Outer apex (256,155), outer feet (141,369)/(371,369), slope
    115/214 = 0.537 - the poster's. The band is 38 units: the scaled band would
    be 34.7 and is widened so the notch survives 16px (a filled triangle is not
    a chevron); wider still and the solid cap above the notch grows past a
    third of the glyph's height and it reads as an arrowhead, not a lambda.
    Inner feet (179,369)/(333,369); inner apex where the shifted edges meet,
    155 + 38/0.537 = (256,226). Edges stay parallel.

    The ring is r 210 with stroke 28, and those two numbers are a 16px budget,
    not a scaling of the full mark (which would give r 186, stroke 14):
      - a coverage rasteriser - every browser - cannot put more light into a
        pixel than the stroke covers of it, so a stroke under ~0.8 device px
        reads as grey. 28 units is 0.875px at 16.
      - the ring's inner edge, r 196, must stay a full device pixel clear of
        the chevron's feet corners at r 161 - 35 units, 1.09px at 16 - or foot
        and ring fuse into one blob.
      - the outer edge, r 224, is 7.0px from the centre at 16: one pixel
        inside the tile on the cardinals, and well inside the rounded corner,
        whose arc (radius 112, centred 112 in from each corner) passes 9.9px
        out on the diagonal.
    Against this ring the chevron's apex sits at 0.48 r and its feet corners at
    0.77 r (the full mark: 0.54 r and 0.87 r); the ring is 13% of its radius
    thick (the full mark's: 7.6%). Those are the costs of legibility at 16px,
    stated here so nobody "corrects" them back.
  -->
  <defs>
    <radialGradient id="aeonGroundCompact" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#0b1428"/>
      <stop offset="62%" stop-color="#050a16"/>
      <stop offset="100%" stop-color="#01030a"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#aeonGroundCompact)"/>

  <!-- The ring: see the header for why r 210 / stroke 28. -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#7fb2ff" stroke-width="28"/>

  <!-- The chevron: see the header for every number. -->
  <path d="M141 369 L256 155 L371 369 L333 369 L256 226 L179 369 Z" fill="#ffffff" stroke="none"/>
</svg>
