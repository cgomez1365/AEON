<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="aeon-mark-title">
  <title id="aeon-mark-title">AEON</title>
  <!-- GENERATED from aeon-mark.svg by tools/generate-aeon-brand-icons.mjs. Do not edit; edit the source. -->
  <!--
    THE AEON MARK — the source of truth for every icon size.

    This file used to be 276 bytes of <image href="/brand/aeon-primary-logo.png">:
    a wrapper around the 1256x1256 marketing poster. Every icon was therefore
    the whole poster squeezed into a square - grid background, ~40% dead margin,
    and the "AEON / MODULAR. LOCAL. YOURS. / INITIALIZE CONNECTION" text block.
    At the sizes actually used - 16px and 22px in the sidebar, 32px favicon,
    48px boot gate - that renders as a blue smudge (CEO, 2026-09-10).

    The direction is now inverted: the vector is the source and the PNGs are
    derived from it. tools/generate-aeon-brand-icons.mjs rasterises this file.

    Geometry is MEASURED off the poster's emblem, not invented - these are its
    own proportions, in half-widths from the centre:
      outer segmented ring   r 0.80, stroke 0.055, four arcs with four gaps
      inner ring             r 0.35
      node circles           at 45, 180 and 315 degrees, sitting proud of the ring
      the glyph              a HOLLOW CHEVRON - an outlined lambda, NOT an A.
                             Least-squares fit on the poster's edge lines:
                             outer apex y -0.185, inner apex y -0.065, flat feet
                             at y +0.209, outer feet x +/-0.212, inner feet
                             x +/-0.147. Both edges of each leg are parallel at a
                             28.3 degree half-angle (apex 56.6 degrees), so the
                             band is a constant 0.065 wide. Wider than tall.
                             No crossbar. The first cut of this file drew one;
                             it was invented - nothing in the emblem is there
                             (the HUD's horizontal crosshair stops at the
                             innermost circle and never crosses the glyph).
                             CEO, 2026-09-11: "isn't really an A - more like a
                             chevron". The wordmark under the emblem IS an A.
                             A second cut then had the right shape and the wrong
                             numbers (apex 51 degrees, tapering band): its
                             "measurement" had captured the innermost circle's
                             bounding box, not the chevron. Fixed by fitting
                             the edges themselves.
      the ring it sits in    the double ring at r 0.343 - drawn here as the
                             single "inner ring". The poster also has a thin
                             innermost circle at r 0.227 which the chevron's
                             feet cross; it is omitted, it cannot survive icon
                             sizes. Against the r 0.343 ring the chevron's apex
                             sits at 0.54 r and its feet corners at 0.87 r,
                             and that proportion is kept exactly.
    One deliberate departure: the inner ring and the chevron inside it are
    scaled up TOGETHER, 1.34x relative to the outer ring (r 0.343 -> 0.461 of
    the half-width, i.e. 118 of 256). The poster treats the glyph as a small detail inside a big
    HUD; an icon has one subject, and below ~64px the chevron is the only
    element that still says AEON. What the poster carries that cannot survive
    that scale - dashed rings, crosshair ticks, slashed circles, corner
    sparkles, the innermost circle - is left out rather than allowed to average
    into grey haze and swallow the glyph.
    One known treatment change: the poster draws the chevron's band as two
    thin edge lines with a dark interior (wireframe); this file fills the band.
    Same six-vertex outline, filled - a double line cannot resolve below ~64px.
    It reads heavier than the source at 256px and above; a stroked large-size
    cut would restore the line-art character there and is the obvious next step
    if that matters.

    Colours sampled from the poster: a white-hot core (#fcffff) blooming blue
    on black.
  -->
  <defs>
    <radialGradient id="aeonGround" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#0b1428"/>
      <stop offset="62%" stop-color="#050a16"/>
      <stop offset="100%" stop-color="#01030a"/>
    </radialGradient>

    <!-- The bloom. Two passes: a wide soft halo under a tight bright core, which
         is what makes the poster read as emitted light rather than blue paint.
         Deliberately restrained - an earlier stdDeviation of 9 looked right at
         512px and dissolved the glyph at 32px, because blur is in user units
         and so scales down with everything else while perception does not. -->
    <filter id="aeonGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="tight"/>
      <feMerge>
        <feMergeNode in="wide"/>
        <feMergeNode in="tight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ground. Icons are composited on unknown backgrounds - a light sidebar, a
       browser tab, a launcher - so the mark carries its own dark field rather
       than assuming one. -->
  <rect width="512" height="512" fill="url(#aeonGround)"/>

  <g transform="translate(256 256) scale(0.8) translate(-256 -256)"><g filter="url(#aeonGlow)" fill="none" stroke-linecap="butt">
    <!-- Outer segmented ring. Four 72-degree arcs with four 18-degree gaps;
         circumference 2*pi*205 = 1288.05, so 257.61 on / 64.40 off. Rotated
         -36 degrees so the gaps land on the diagonals, as the poster's do. -->
    <circle cx="256" cy="256" r="205"
            stroke="#bcd8ff" stroke-width="14"
            stroke-dasharray="257.61 64.40"
            transform="rotate(-36 256 256)"/>

    <!-- Node circles: 315 (upper right), 45 (lower right), 180 (left).
         r 218 = 0.85 half-widths, so they sit proud of the ring, as measured. -->
    <circle cx="410.15" cy="101.85" r="24" stroke="#eaf3ff" stroke-width="10"/>
    <circle cx="410.15" cy="410.15" r="24" stroke="#eaf3ff" stroke-width="10"/>
    <circle cx="38"     cy="256"    r="24" stroke="#eaf3ff" stroke-width="10"/>

    <!-- Inner ring. Stroke 9, not 6: 6/512 draws at 0.375px in the 32px
         favicon and read at 25-40% luminance - barely a ring. -->
    <circle cx="256" cy="256" r="118" stroke="#7fb2ff" stroke-width="9"/>

    <!-- The chevron. One FILLED polygon, six vertices: the outer edge up to the
         apex and down, then the inner edge back, closed by the flat feet. Drawn
         as a shape rather than a stroked line because the poster's glyph is an
         outline with a hollow interior and flat feet, and a stroke gives neither.
         The poster's numbers scaled by 118/115 onto this ring:
           outer apex (256,192), outer feet (183,328)/(329,328)  slope 73/136 = 0.537
           inner apex (256,233), inner feet (205,328)/(307,328)  slope 51/95  = 0.537
         Parallel edges, 22-unit horizontal band, apex 56.5 degrees. The inner
         apex is where the inward-shifted edges meet: outer apex + 22/0.537.
         Below ~32px the hollow closes and it reads as a solid chevron, which is
         the right silhouette - see aeon-mark-compact.svg for those sizes. -->
    <path d="M183 328 L256 192 L329 328 L307 328 L256 233 L205 328 Z" fill="#ffffff" stroke="none"/>
  </g>
</g>
</svg>
