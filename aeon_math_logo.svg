<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="66%">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.72" stop-color="#030811"/>
      <stop offset="1" stop-color="#010307"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .grid { fill: none; stroke: #167eb1; stroke-width: 1; opacity: .17; }
      .construction { fill: none; stroke: #43c8ff; stroke-width: 2; opacity: .38; }
      .ink { fill: none; stroke: #b9edff; stroke-width: 13; stroke-linecap: square; stroke-linejoin: miter; }
      .fine { fill: none; stroke: #43c8ff; stroke-width: 3; opacity: .8; }
    </style>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- Cartesian drafting grid, centered at (500,500), 40px module. -->
  <g class="grid">
    <path d="M100 100H900M100 140H900M100 180H900M100 220H900M100 260H900M100 300H900M100 340H900M100 380H900M100 420H900M100 460H900M100 500H900M100 540H900M100 580H900M100 620H900M100 660H900M100 700H900M100 740H900M100 780H900M100 820H900M100 860H900M100 900H100"/>
    <path d="M100 100V900M140 100V900M180 100V900M220 100V900M260 100V900M300 100V900M340 100V900M380 100V900M420 100V900M460 100V900M500 100V900M540 100V900M580 100V900M620 100V900M660 100V900M700 100V900M740 100V900M780 100V900M820 100V900M860 100V900M900 100V900"/>
  </g>

  <!-- Construction geometry: R=300, r=186, modular node radius=22. -->
  <g class="construction">
    <circle cx="500" cy="500" r="300" stroke-dasharray="2 14"/>
    <circle cx="500" cy="500" r="226" stroke-dasharray="8 18"/>
    <circle cx="500" cy="500" r="186" stroke-dasharray="2 12"/>
    <path d="M100 500H900M500 100V900" stroke-dasharray="10 18"/>
    <path d="M288 288L712 712M712 288L288 712" stroke-dasharray="4 20" opacity=".22"/>
  </g>

  <!-- 4's open orbit, split at the A's upward axis; nodes are 90-degree modules. -->
  <g class="ink" filter="url(#softGlow)">
    <path d="M500 200 A300 300 0 0 1 800 500"/>
    <path d="M800 500 A300 300 0 0 1 500 800"/>
    <path d="M500 800 A300 300 0 0 1 200 500"/>
    <path d="M200 500 A300 300 0 0 1 500 200"/>
  </g>

  <!-- 17/14 A: vertices lie on the inner construction circle. -->
  <g class="ink" filter="url(#glow)">
    <path d="M350 690L500 310L650 690"/>
    <path d="M405 550H595"/>
  </g>

  <!-- persistent core, centered and deliberately quiet -->
  <circle cx="500" cy="500" r="44" fill="#061321" stroke="#78dcff" stroke-width="5" filter="url(#glow)"/>
  <circle cx="500" cy="500" r="12" fill="#b9edff" filter="url(#softGlow)"/>

  <!-- four measured modular nodes -->
  <g fill="#55d4ff" stroke="#b9edff" stroke-width="4" filter="url(#softGlow)">
    <circle cx="500" cy="200" r="18"/><circle cx="800" cy="500" r="18"/>
    <circle cx="500" cy="800" r="18"/><circle cx="200" cy="500" r="18"/>
  </g>

  <!-- registration ticks and a small archival datum -->
  <g class="fine">
    <path d="M500 126V164M500 836V874M126 500H164M836 500H874"/>
    <path d="M330 650L350 670M670 650L650 670"/>
  </g>
  <g fill="#43c8ff" opacity=".9">
    <circle cx="500" cy="126" r="4"/><circle cx="874" cy="500" r="4"/>
  </g>
</svg>
